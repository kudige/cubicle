[installation]
bindir=/usr/local/bin
libexecdir=/usr/local/libexec/cubicle

[manager]
controller_binary=/usr/local/libexec/cubicle/cubicle-controller
socket_mode=0660

[controller]
debug=none

[cube]
debug=none
automanager=true

[desk]
debug=none
automanager=true
scrollback_lines=10000
prefix=Control-X

[defaults]
launch=foreground
mode=tty
